<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Google sign-in test</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="font-family: sans-serif; padding: 24px">
  <h2>Google sign-in test</h2>
  <div id="btn"></div>
  <pre id="out" style="margin-top: 20px; background: #eee; padding: 12px">Waiting...</pre>

  <script>
    const CLIENT_ID = "235287919120-6o37j5dg537f2om8dfnfjk96odmshpgl.apps.googleusercontent.com";

    window.onload = () => {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: async (response) => {
          const res = await fetch("http://localhost:5000/api/auth/google", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credential: response.credential }),
          });
          const data = await res.json();
          document.getElementById("out").textContent =
            "Status " + res.status + "\n" + JSON.stringify(data, null, 2);
        },
      });
      google.accounts.id.renderButton(document.getElementById("btn"), { theme: "outline", size: "large" });
    };
  </script>
</body>
</html>
